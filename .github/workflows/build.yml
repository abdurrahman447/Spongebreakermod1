name: Build Fabric Mod

# 1.21 branch'ine push veya pull request olunca tetiklenecek
on:
  push:
    branches: [ "1.21" ]
  pull_request:
    branches: [ "1.21" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repo'yu klonla
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle wrapper kontrolü
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Java 21 kurulumu (Temurin)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle wrapper executable yap
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Build çalıştır
      - name: Build Mod
        run: ./gradlew build

      # Build sonrası .jar dosyasını artifact olarak yükle
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
